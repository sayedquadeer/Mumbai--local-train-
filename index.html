<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbai Local Live Timetable</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6C4DFF; --bg: #F7F5FF; --dark: #17142B; }
        * { box-sizing: border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 50px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
        header { background: var(--primary); color: #fff; padding: 15px 0; position: sticky; top:0; z-index:100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { color:#fff; text-decoration:none; font-weight:800; font-size:1.1rem; }
        .hero { background: var(--dark); color:#fff; padding: 30px 16px; text-align:center; }
        .search-card { background:#fff; border-radius:16px; padding:20px; margin-top:-25px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
        .form-group { position:relative; margin-bottom:12px; }
        .form-group label { font-size:0.75rem; font-weight:800; color:var(--primary); display:block; margin-bottom:4px; }
        .input-field { width:100%; padding:12px; border:2px solid #E5E7EB; border-radius:10px; font-weight:600; outline:none; }
        .dropdown { position:absolute; top:100%; left:0; right:0; background:#fff; border:2px solid var(--primary); border-radius:10px; z-index:9999; display:none; max-height:220px; overflow-y:auto; box-shadow:0 10px 20px rgba(0,0,0,0.15); }
        .dropdown-item { padding:12px; font-weight:700; cursor:pointer; border-bottom:1px solid #eee; display:flex; justify-content:space-between; }
        .dropdown-item:hover { background:var(--bg); color:var(--primary); }
        .btn { width:100%; background:var(--primary); color:#fff; border:none; padding:14px; border-radius:10px; font-weight:800; cursor:pointer; font-size:1rem; margin-top:8px; }
        .section-title { margin:24px 0 12px; font-weight:800; }
        .line-tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; }
        .tab-btn { padding:8px 16px; background:#fff; border:1px solid #ddd; border-radius:20px; font-weight:700; font-size:0.8rem; cursor:pointer; white-space:nowrap; }
        .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .chips { display:flex; flex-wrap:wrap; gap:8px; background:#fff; padding:12px; border-radius:12px; }
        .chip { background:var(--bg); padding:6px 12px; border-radius:16px; font-size:0.8rem; font-weight:600; cursor:pointer; }
        .train-card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
        .pf-badge { background:#FEF3C7; color:#B45309; font-weight:800; padding:3px 8px; border-radius:6px; font-size:0.8rem; display:inline-block; margin-top:6px; }
        .live-tag { background:#10B981; color:#fff; font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:12px; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo">🚆 Mumbai Local Live Schedule</a>
            <span class="live-tag">LIVE TIME</span>
        </div>
    </header>

    <div class="hero">
        <h2>Live Mumbai Local Train Search</h2>
        <p style="font-size:0.85rem; color:#ccc;">Get real-time upcoming trains based on current time</p>
    </div>

    <div class="container">
        <div class="search-card">
            <div class="form-group">
                <label>FROM STATION</label>
                <input type="text" id="from-input" class="input-field" placeholder="Type station (e.g. Govandi)..." autocomplete="off">
                <div id="from-dd" class="dropdown"></div>
            </div>
            <div class="form-group">
                <label>TO STATION</label>
                <input type="text" id="to-input" class="input-field" placeholder="Type station (e.g. Kurla)..." autocomplete="off">
                <div id="to-dd" class="dropdown"></div>
            </div>
            <button class="btn" onclick="searchTrains()">Find Trains</button>
        </div>

        <div>
            <h3 class="section-title">Select Line</h3>
            <div class="line-tabs">
                <button class="tab-btn active" onclick="loadChips('central', this)">CENTRAL</button>
                <button class="tab-btn" onclick="loadChips('western', this)">WESTERN</button>
                <button class="tab-btn" onclick="loadChips('harbour', this)">HARBOUR</button>
                <button class="tab-btn" onclick="loadChips('trans', this)">TRANS-HARBOUR</button>
            </div>
            <div class="chips" id="chip-box"></div>
        </div>

        <div>
            <h3 class="section-title" id="results-title">Upcoming Trains</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        const data = {
            central: ["CSMT", "Masjid", "Sandhurst Road", "Byculla", "Chinchpokli", "Currey Road", "Parel", "Dadar", "Matunga", "Sion", "Kurla", "Vidyavihar", "Ghatkopar", "Vikhroli", "Kanjurmarg", "Bhandup", "Nahur", "Mulund", "Thane", "Kalva", "Mumbra", "Diva", "Kopar", "Dombivli", "Thakurli", "Kalyan", "Vitthalwadi", "Ulhasnagar", "Ambernath", "Badlapur", "Karjat", "Kasara"],
            western: ["Churchgate", "Marine Lines", "Charni Road", "Grant Road", "Mumbai Central", "Mahalakshmi", "Lower Parel", "Prabhadevi", "Dadar", "Matunga Road", "Mahim", "Bandra", "Khar Road", "Santacruz", "Vile Parle", "Andheri", "Jogeshwari", "Ram Mandir", "Goregaon", "Malad", "Kandivali", "Borivali", "Dahisar", "Mira Road", "Bhayandar", "Naigaon", "Vasai Road", "Nallasopara", "Virar", "Dahanu Road"],
            harbour: ["CSMT", "Masjid", "Sandhurst Road", "Dockyard Road", "Reay Road", "Cotton Green", "Sewri", "Wadala Road", "GTB Nagar", "Chunabhatti", "Kurla", "Tilak Nagar", "Chembur", "Govandi", "Mankhurd", "Vashi", "Sanpada", "Juinagar", "Nerul", "Belapur", "Kharghar", "Panvel"],
            trans: ["Thane", "Airoli", "Rabale", "Ghansoli", "Koparkhairane", "Turbhe", "Juinagar", "Nerul", "Belapur", "Vashi"]
        };

        const allSt = [...new Set([...data.central, ...data.western, ...data.harbour, ...data.trans])].sort();

        window.onload = () => {
            loadChips('central');
            setupSearch('from-input', 'from-dd');
            setupSearch('to-input', 'to-dd');
            searchTrains();
        };

        function loadChips(line, btn) {
            if(btn) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            document.getElementById('chip-box').innerHTML = data[line].map(s => `<span class="chip" onclick="fillSt('${s}')">${s}</span>`).join('');
        }

        function fillSt(s) {
            const f = document.getElementById('from-input');
            const t = document.getElementById('to-input');
            if(!f.value) f.value = s; else t.value = s;
        }

        function setupSearch(inpId, ddId) {
            const inp = document.getElementById(inpId);
            const dd = document.getElementById(ddId);

            inp.addEventListener('input', () => {
                const val = inp.value.toLowerCase().trim();
                if(!val) { dd.style.display = 'none'; return; }
                const matches = allSt.filter(s => s.toLowerCase().includes(val)).slice(0, 8);
                if(!matches.length) { dd.style.display = 'none'; return; }

                dd.innerHTML = matches.map(s => `
                    <div class="dropdown-item" onclick="selectSt('${inpId}','${ddId}','${s}')">
                        <span>${s}</span> <small style="color:#888">Station</small>
                    </div>
                `).join('');
                dd.style.display = 'block';
            });

            document.addEventListener('click', (e) => {
                if(e.target !== inp && e.target !== dd) dd.style.display = 'none';
            });
        }

        function selectSt(inpId, ddId, val) {
            document.getElementById(inpId).value = val;
            document.getElementById(ddId).style.display = 'none';
        }

        // DYNAMIC LIVE TIME GENERATOR
        function getTimeAfter(minutesToAdd) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + minutesToAdd);
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        function searchTrains() {
            const from = document.getElementById('from-input').value.trim();
            const to = document.getElementById('to-input').value.trim();

            let titleText = "Upcoming Trains (Next 1 Hour)";
            if(from && to) {
                titleText = `Upcoming Trains: ${from} → ${to}`;
            }
            document.getElementById('results-title').innerText = titleText;

            // Generate trains dynamically starting from current live time
            const liveTrains = [
                { name: `${from || 'CSMT'} - ${to || 'Kalyan'} Fast`, type: "FAST", pf: "PF No. 4", dep: getTimeAfter(4), arr: getTimeAfter(28) },
                { name: `${from || 'CSMT'} - ${to || 'Thane'} Slow`, type: "SLOW", pf: "PF No. 1", dep: getTimeAfter(11), arr: getTimeAfter(42) },
                { name: `${from || 'Churchgate'} - ${to || 'Borivali'} AC`, type: "AC FAST", pf: "PF No. 3", dep: getTimeAfter(18), arr: getTimeAfter(50) },
                { name: `${from || 'CSMT'} - ${to || 'Panvel'} Slow`, type: "SLOW", pf: "PF No. 2", dep: getTimeAfter(26), arr: getTimeAfter(62) }
            ];

            document.getElementById('results').innerHTML = liveTrains.map(t => `
                <div class="train-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h4>${t.name}</h4>
                        <span style="font-size:0.75rem; font-weight:800; color:var(--primary);">${t.type}</span>
                    </div>
                    <span class="pf-badge">🚉 Platform: ${t.pf}</span>
                    <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:800; color:#10B981;">Departs: ${t.dep}</span>
                        <span style="font-weight:700; color:#555;">Arrives: ${t.arr}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
