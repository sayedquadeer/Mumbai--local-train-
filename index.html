<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbai Local Train Timetable, Routes & Journey Planner</title>
    <meta name="description" content="Find Mumbai local train timetables, station routes, Central, Western, Harbour and Trans-Harbour line information with an easy journey planner.">
    <meta name="keywords" content="Mumbai Local, Train Timetable, Central Line, Western Line, Harbour Line, Journey Planner, Train Route">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Mumbai Local Train Timetable, Routes & Journey Planner">
    <meta property="og:description" content="Find Mumbai local train timetables, routes, and live-like schedule information instantly.">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6C4DFF;
            --secondary: #8B5CF6;
            --accent: #A78BFA;
            --bg-main: #F7F5FF;
            --text-dark: #17142B;
            --text-muted: #6B7280;
            --white: #FFFFFF;
            --card-border: rgba(108, 77, 255, 0.12);
            --shadow-sm: 0 4px 6px -1px rgba(108, 77, 255, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(108, 77, 255, 0.12);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --fast-tag: #EF4444;
            --slow-tag: #10B981;
            --ac-tag: #06B6D4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: 80px;
        }

        /* Container Limit */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(108, 77, 255, 0.95);
            backdrop-filter: blur(12px);
            color: var(--white);
            box-shadow: 0 4px 20px rgba(23, 20, 43, 0.15);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--white);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(23, 20, 43, 0.82) 0%, rgba(108, 77, 255, 0.75) 100%),
                        url('https://images.unsplash.com/photo-1570125909232-eb263c188f7e?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            padding: 60px 0 100px;
            color: var(--white);
            text-align: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .hero h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search Card Glassmorphism */
        .search-card-wrapper {
            margin-top: -60px;
            position: relative;
            z-index: 10;
        }

        .search-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--card-border);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr 150px 150px;
            gap: 16px;
            align-items: center;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E5E7EB;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .swap-btn {
            background: var(--bg-main);
            border: 2px solid #E5E7EB;
            color: var(--primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .swap-btn:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* Autocomplete Dropdown */
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            z-index: 50;
            max-height: 240px;
            overflow-y: auto;
            margin-top: 4px;
            display: none;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .autocomplete-item:hover, .autocomplete-item.active {
            background-color: var(--bg-main);
            color: var(--primary);
        }

        .autocomplete-item mark {
            background: transparent;
            color: var(--primary);
            font-weight: 700;
        }

        .search-submit-btn {
            grid-column: span 5;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: var(--radius-sm);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(108, 77, 255, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .search-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 77, 255, 0.4);
        }

        /* Section Layouts */
        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 40px 0 20px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Line Selector */
        .line-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .line-tab {
            padding: 10px 20px;
            background: var(--white);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .line-tab.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .station-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--white);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
        }

        .chip {
            background: var(--bg-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
        }

        .chip:hover {
            background: var(--accent);
            color: var(--white);
        }

        /* Filter Controls */
        .filters-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--white);
            border: 1px solid #E5E7EB;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--text-dark);
            color: var(--white);
            border-color: var(--text-dark);
        }

        /* Results Display */
        .results-container {
            display: grid;
            gap: 16px;
        }

        .train-card {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .train-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .train-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--white);
            text-transform: uppercase;
        }

        .bg-fast { background-color: var(--fast-tag); }
        .bg-slow { background-color: var(--slow-tag); }
        .bg-ac { background-color: var(--ac-tag); }

        .time-block {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .time-node {
            text-align: center;
        }

        .time-node .time {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .time-node .station {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .duration-line {
            flex-grow: 1;
            text-align: center;
            position: relative;
            padding: 0 10px;
        }

        .duration-line .line {
            height: 2px;
            background: #E5E7EB;
            width: 100%;
            margin: 6px 0;
            position: relative;
        }

        .duration-line .duration {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Journey Planner Visual Route */
        .route-planner-card {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 24px;
            border: 1px solid var(--card-border);
            margin-top: 20px;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
            margin-top: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 5px;
            bottom: 5px;
            width: 3px;
            background: var(--primary);
        }

        .timeline-step {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-step::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--white);
        }

        .timeline-step.interchange::before {
            background: #F59E0B;
        }

        .timeline-step .title {
            font-weight: 700;
            font-size: 1rem;
        }

        .timeline-step .desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Popular Routes & Lines Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .popular-card, .line-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .popular-card:hover, .line-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .popular-card h4 {
            font-size: 1.05rem;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .popular-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* FAQ Accordion */
        .faq-item {
            background: var(--white);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            border: 1px solid var(--card-border);
            overflow: hidden;
        }

        .faq-question {
            padding: 18px 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .faq-answer {
            padding: 0 20px 18px;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: none;
        }

        /* Footer */
        footer {
            background: var(--text-dark);
            color: var(--white);
            padding: 40px 0;
            margin-top: 60px;
            font-size: 0.9rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-col h4 {
            color: var(--accent);
            margin-bottom: 14px;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 8px;
        }

        .footer-col ul li a {
            color: #9CA3AF;
            text-decoration: none;
        }

        .footer-bottom {
            text-align: center;
            border-top: 1px solid #374151;
            padding-top: 20px;
            color: #9CA3AF;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 900px) {
            .search-grid {
                grid-template-columns: 1fr;
            }

            .swap-btn {
                margin: -10px auto;
                transform: rotate(90deg);
            }

            .search-submit-btn {
                grid-column: span 1;
            }

            .hero h1 {
                font-size: 1.8rem;
            }

            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .train-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .time-block {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="container header-content">
            <a href="#" class="logo">🚆 Mumbai Local</a>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#lines-section">Lines</a></li>
                <li><a href="#journey-planner">Journey Planner</a></li>
                <li><a href="#popular-routes">Popular Routes</a></li>
                <li><a href="#faq">FAQ</a></li>
            </ul>
            <button class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>मुंबई Local Train Timetable</h1>
            <h2>Mumbai Local Train Timetable</h2>
            <p>Find the fastest local train between Mumbai stations seamlessly.</p>
        </div>
    </section>

    <!-- Main Search Card -->
    <div class="container search-card-wrapper">
        <div class="search-card">
            <div class="search-grid">
                
                <!-- FROM FIELD -->
                <div class="input-group">
                    <label for="from-station">FROM</label>
                    <input type="text" id="from-station" class="input-field" placeholder="Search departure..." autocomplete="off">
                    <div id="from-dropdown" class="autocomplete-dropdown"></div>
                </div>

                <!-- SWAP BUTTON -->
                <button class="swap-btn" id="swap-btn" title="Swap Stations">⇅</button>

                <!-- TO FIELD -->
                <div class="input-group">
                    <label for="to-station">TO</label>
                    <input type="text" id="to-station" class="input-field" placeholder="Search destination..." autocomplete="off">
                    <div id="to-dropdown" class="autocomplete-dropdown"></div>
                </div>

                <!-- TIME FIELD -->
                <div class="input-group">
                    <label for="time-select">TRAIN TIME</label>
                    <select id="time-select" class="input-field">
                        <option value="09:00">09:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="12:00">12:00 PM</option>
                        <option value="17:00">05:00 PM</option>
                        <option value="18:00">06:00 PM</option>
                    </select>
                </div>

                <!-- UNTIL FIELD -->
