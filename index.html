<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbai Local Live Route & Timetable</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6C4DFF; --bg: #F7F5FF; --dark: #17142B; }
        * { box-sizing: border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 50px; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }
        header { background: var(--primary); color: #fff; padding: 15px 0; position: sticky; top:0; z-index:100; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { color:#fff; text-decoration:none; font-weight:800; font-size:1.1rem; }
        .hero { background: var(--dark); color:#fff; padding: 25px 16px; text-align:center; }
        .search-card { background:#fff; border-radius:16px; padding:20px; margin-top:-25px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
        .form-group { position:relative; margin-bottom:12px; }
        .form-group label { font-size:0.75rem; font-weight:800; color:var(--primary); display:block; margin-bottom:4px; }
        .input-field { width:100%; padding:12px; border:2px solid #E5E7EB; border-radius:10px; font-weight:600; outline:none; }
        .dropdown { position:absolute; top:100%; left:0; right:0; background:#fff; border:2px solid var(--primary); border-radius:10px; z-index:9999; display:none; max-height:200px; overflow-y:auto; box-shadow:0 10px 20px rgba(0,0,0,0.15); }
        .dropdown-item { padding:10px 12px; font-weight:700; cursor:pointer; border-bottom:1px solid #eee; display:flex; justify-content:space-between; }
        .dropdown-item:hover { background:var(--bg); color:var(--primary); }
        .btn { width:100%; background:var(--primary); color:#fff; border:none; padding:14px; border-radius:10px; font-weight:800; cursor:pointer; font-size:1rem; margin-top:6px; }
        
        .section-title { margin:20px 0 10px; font-weight:800; font-size:1rem; }
        .line-tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:10px; }
        .tab-btn { padding:8px 14px; background:#fff; border:1px solid #ddd; border-radius:20px; font-weight:700; font-size:0.75rem; cursor:pointer; white-space:nowrap; }
        .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .chips { display:flex; flex-wrap:wrap; gap:6px; background:#fff; padding:12px; border-radius:12px; max-height:140px; overflow-y:auto; }
        .chip { background:var(--bg); padding:5px 10px; border-radius:14px; font-size:0.75rem; font-weight:600; cursor:pointer; }
        
        .train-card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); cursor:pointer; border-left: 5px solid var(--primary); }
        .pf-badge { background:#FEF3C7; color:#B45309; font-weight:800; padding:2px 8px; border-radius:6px; font-size:0.75rem; display:inline-block; margin-top:4px; }
        
        .route-timeline { display:none; margin-top:14px; padding-top:14px; border-top:1px dashed #DDD; }
        .route-timeline.active { display:block; }
        .stop-item { display:flex; justify-content:space-between; align-items:center; padding:6px 0 6px 20px; position:relative; border-left: 2px solid #E5E7EB; margin-left:6px; }
        .stop-item::before { content:''; position:absolute; left:-6px; top:10px; width:10px; height:10px; border-radius:50%; background:#9CA3AF; }
        .stop-item.passed { color:#9CA3AF; }
        .stop-item.passed .st-name { text-decoration: line-through; }
        .stop-item.current { color:#10B981; font-weight:800; }
        .stop-item.current::before { background:#10B981; box-shadow:0 0 0 3px rgba(16, 185, 129, 0.2); }
        .stop-item.upcoming::before { background:var(--primary); }
        .tag { font-size:0.6rem; padding:2px 6px; border-radius:4px; font-weight:800; text-transform:uppercase; margin-left:6px; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo">🚆 Mumbai Local Live</a>
        </div>
    </header>

    <div class="hero">
        <h2>Live Route Planner & Timetable</h2>
    </div>

    <div class="container">
        <div class="search-card">
            <div class="form-group">
                <label>FROM STATION</label>
                <input type="text" id="from-input" class="input-field" value="Borivali" placeholder="Type station..." autocomplete="off">
                <div id="from-dd" class="dropdown"></div>
            </div>
            <div class="form-group">
                <label>TO STATION</label>
                <input type="text" id="to-input" class="input-field" value="Churchgate" placeholder="Type station..." autocomplete="off">
                <div id="to-dd" class="dropdown"></div>
            </div>
            <button class="btn" onclick="searchTrains()">Find Trains & Show Route</button>
        </div>

        <div>
            <h3 class="section-title">Select Line</h3>
            <div class="line-tabs">
                <button class="tab-btn active" onclick="loadChips('western', this)">WESTERN</button>
                <button class="tab-btn" onclick="loadChips('central', this)">CENTRAL</button>
                <button class="tab-btn" onclick="loadChips('harbour', this)">HARBOUR</button>
                <button class="tab-btn" onclick="loadChips('trans', this)">TRANS-HARBOUR</button>
            </div>
            <div class="chips" id="chip-box"></div>
        </div>

        <div>
            <h3 class="section-title" id="results-title">Upcoming Trains</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        const data = {
            western: ["Churchgate", "Marine Lines", "Charni Road", "Grant Road", "Mumbai Central", "Mahalakshmi", "Lower Parel", "Prabhadevi", "Dadar", "Matunga Road", "Mahim", "Bandra", "Khar Road", "Santacruz", "Vile Parle", "Andheri", "Jogeshwari", "Ram Mandir", "Goregaon", "Malad", "Kandivali", "Borivali", "Dahisar", "Mira Road", "Bhayandar", "Naigaon", "Vasai Road", "Nallasopara", "Virar", "Dahanu Road"],
            central: ["CSMT", "Masjid", "Sandhurst Road", "Byculla", "Chinchpokli", "Currey Road", "Parel", "Dadar", "Matunga", "Sion", "Kurla", "Vidyavihar", "Ghatkopar", "Vikhroli", "Kanjurmarg", "Bhandup", "Nahur", "Mulund", "Thane", "Kalva", "Mumbra", "Diva", "Kopar", "Dombivli", "Thakurli", "Kalyan", "Vitthalwadi", "Ulhasnagar", "Ambernath", "Badlapur", "Karjat", "Kasara"],
            harbour: ["CSMT", "Masjid", "Sandhurst Road", "Dockyard Road", "Reay Road", "Cotton Green", "Sewri", "Wadala Road", "GTB Nagar", "Chunabhatti", "Kurla", "Tilak Nagar", "Chembur", "Govandi", "Mankhurd", "Vashi", "Sanpada", "Juinagar", "Nerul", "Belapur", "Kharghar", "Panvel"],
            trans: ["Thane", "Airoli", "Rabale", "Ghansoli", "Koparkhairane", "Turbhe", "Juinagar", "Nerul", "Belapur", "Vashi"]
        };

        const allSt = [...new Set([...data.central, ...data.western, ...data.harbour, ...data.trans])].sort();

        window.onload = () => {
            loadChips('western');
            setupSearch('from-input', 'from-dd');
            setupSearch('to-input', 'to-dd');
            searchTrains();
        };

        function loadChips(line, btn) {
            if(btn) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            document.getElementById('chip-box').innerHTML = data[line].map(s => `<span class="chip" onclick="fillSt('${s}')">${s}</span>`).join('');
        }

        function fillSt(s) {
            const f = document.getElementById('from-input');
            const t = document.getElementById('to-input');
            if(!f.value) f.value = s; else t.value = s;
        }

        function setupSearch(inpId, ddId) {
            const inp = document.getElementById(inpId);
            const dd = document.getElementById(ddId);

            inp.addEventListener('input', () => {
                const val = inp.value.toLowerCase().trim();
                if(!val) { dd.style.display = 'none'; return; }
                const matches = allSt.filter(s => s.toLowerCase().includes(val)).slice(0, 8);
                if(!matches.length) { dd.style.display = 'none'; return; }

                dd.innerHTML = matches.map(s => `
                    <div class="dropdown-item" onclick="selectSt('${inpId}','${ddId}','${s}')">
                        <span>${s}</span> <small style="color:#888">Station</small>
                    </div>
                `).join('');
                dd.style.display = 'block';
            });

            document.addEventListener('click', (e) => {
                if(e.target !== inp && e.target !== dd) dd.style.display = 'none';
            });
        }

        function selectSt(inpId, ddId, val) {
            document.getElementById(inpId).value = val;
            document.getElementById(ddId).style.display = 'none';
        }

        function getLiveTimeOffset(baseMinutes) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + baseMinutes);
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        function searchTrains() {
            const from = document.getElementById('from-input').value.trim() || "Borivali";
            const to = document.getElementById('to-input').value.trim() || "Churchgate";

            let lineKey = 'western';
            if(data.central.includes(from) && data.central.includes(to)) lineKey = 'central';
            else if(data.harbour.includes(from) && data.harbour.includes(to)) lineKey = 'harbour';
            else if(data.trans.includes(from) && data.trans.includes(to)) lineKey = 'trans';

            const lineStops = data[lineKey];
            const startIdx = lineStops.indexOf(from);
            const endIdx = lineStops.indexOf(to);

            let route = [];
            if(startIdx !== -1 && endIdx !== -1) {
                if(startIdx < endIdx) route = lineStops.slice(startIdx, endIdx + 1);
                else route = lineStops.slice(endIdx, startIdx + 1).reverse();
            } else {
                route = [from, "Intermediate Stop 1", "Intermediate Stop 2", to];
            }

            document.getElementById('results-title').innerText = `Upcoming Trains: ${from} → ${to}`;

            const trainsList = [
                { name: `${from} – ${to} Fast`, type: "FAST", pf: "PF No. 4", dep: getLiveTimeOffset(3), arr: getLiveTimeOffset(35) },
                { name: `${from} – ${to} Slow`, type: "SLOW", pf: "PF No. 1", dep: getLiveTimeOffset(12), arr: getLiveTimeOffset(52) },
                { name: `${from} – ${to} AC Fast`, type: "AC FAST", pf: "PF No. 3", dep: getLiveTimeOffset(20), arr: getLiveTimeOffset(50) }
            ];

            document.getElementById('results').innerHTML = trainsList.map((t, idx) => `
                <div class="train-card" onclick="this.querySelector('.route-timeline').classList.toggle('active')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h4>${t.name}</h4>
                        <span style="font-size:0.75rem; font-weight:800; color:var(--primary);">${t.type}</span>
                    </div>
                    <span class="pf-badge">🚉 Platform: ${t.pf}</span>
                    <div style="margin-top:8px; display:flex; justify-content:space-between; font-size:0.9rem;">
                        <span style="font-weight:800; color:#10B981;">Departs: ${t.dep}</span>
                        <span style="font-weight:700; color:#555;">Arrives: ${t.arr}</span>
                    </div>
                    <small style="color:var(--primary); font-weight:700; display:block; margin-top:8px;">👇 Tap to see complete route & station timings</small>

                    <div class="route-timeline">
                        <h5 style="margin-bottom:10px; color:var(--dark);">Route Stops:</h5>
                        ${route.map((s, i) => {
                            const isCurrent = i === 0;
                            const stopTime = getLiveTimeOffset((i * 3) + (idx * 10));
                            return `
                                <div class="stop-item ${isCurrent ? 'current' : 'upcoming'}">
                                    <span class="st-name">${s} ${isCurrent ? '<span class="tag" style="background:#10B981; color:white;">Boarding</span>' : ''}</span>
                                    <small style="font-weight:800; color:#4B5563;">${stopTime}</small>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
